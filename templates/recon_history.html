<section class="card"><div class="eyebrow">RECON HISTORY</div><h2>Recent website assessments</h2><div class="table-scroll"><table><thead><tr><th>Target</th><th>Engagement</th><th>Started (UTC)</th><th>Progress</th></tr></thead><tbody>{% for item in recent %}<tr><td><a href="/assessments/{{ item.engagement_id }}/recon/{{ item.id }}">{{ item.target_reference }}</a></td><td>{{ item.client_name }}</td><td>{{ item.started_at }}</td><td><span class="badge {{ item.status }}">{{ item.progress }}</span></td></tr>{% else %}<tr><td colspan="4" class="muted">No Recon assessments yet.</td></tr>{% endfor %}</tbody></table></div></section>
